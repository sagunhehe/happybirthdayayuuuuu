<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday - Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#4285f4; --red:#ea4335; --yellow:#fbbc05; --green:#34a853;
  --bg:#ffffff; --text:#202124; --muted:#5f6368; --link:#1a0dab; --url:#202124;
  --border:#dfe1e5; --chip:#f1f3f4; --panel:#ffffff; --hover:#f8f9fa; --footer:#f2f2f2;
  --shadow:0 1px 6px rgba(32,33,36,.28);
  --sans:"Roboto",Arial,"Helvetica Neue",sans-serif;
  --logo:"Outfit","Product Sans","Trebuchet MS",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#202124; --text:#e8eaed; --muted:#9aa0a6; --link:#8ab4f8; --url:#bdc1c6;
    --border:#5f6368; --chip:#303134; --panel:#202124; --hover:#303134; --footer:#171717;
    --shadow:0 1px 6px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#202124; --text:#e8eaed; --muted:#9aa0a6; --link:#8ab4f8; --url:#bdc1c6;
  --border:#5f6368; --chip:#303134; --panel:#202124; --hover:#303134; --footer:#171717;
  --shadow:0 1px 6px rgba(0,0,0,.6);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;min-height:100%;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.hidden{display:none !important}

/* ---------- logo ---------- */
.logo{font-family:var(--logo);font-weight:500;letter-spacing:-.04em;line-height:1;white-space:nowrap;cursor:pointer;background:none;border:0;padding:0}
.logo span:nth-child(6n+1){color:var(--blue)} .logo span:nth-child(6n+2){color:var(--red)}
.logo span:nth-child(6n+3){color:var(--yellow)} .logo span:nth-child(6n+4){color:var(--blue)}
.logo span:nth-child(6n+5){color:var(--green)} .logo span:nth-child(6n+6){color:var(--red)}

/* ---------- search box ---------- */
.sbox{position:relative;width:100%}
.sbar{display:flex;align-items:center;height:46px;border:1px solid var(--border);border-radius:24px;background:var(--panel);padding:0 14px;gap:10px;transition:box-shadow .15s}
.sbar:hover,.sbox.open .sbar{box-shadow:var(--shadow);border-color:transparent}
.sbox.open .sbar{border-bottom-left-radius:0;border-bottom-right-radius:0}
.sbar input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font:16px var(--sans)}
.sbar svg{flex:none;fill:var(--muted)}
.sbar .mic{background:none;border:0;padding:0;display:flex}
.sbar .mic svg path:nth-child(1){fill:#4285f4}.sbar .mic svg path:nth-child(2){fill:#34a853}.sbar .mic svg path:nth-child(3){fill:#fbbc05}.sbar .mic svg path:nth-child(4){fill:#ea4335}
.sug{position:absolute;left:0;right:0;top:100%;background:var(--panel);box-shadow:var(--shadow);border-radius:0 0 24px 24px;padding:6px 0 14px;z-index:20;border-top:1px solid var(--border);margin:0;list-style:none}
.sug li{display:flex;gap:14px;align-items:center;padding:7px 16px;cursor:pointer;font-size:16px}
.sug li:hover,.sug li.sel{background:var(--hover)}
.sug svg{fill:var(--muted);flex:none}

/* ---------- home ---------- */
#home{flex:1;display:flex;flex-direction:column}
.topbar{display:flex;justify-content:flex-end;align-items:center;gap:18px;padding:14px 20px}
.topbar button.link{background:none;border:0;color:var(--text);font-size:13px;padding:6px}
.topbar button.link:hover{text-decoration:underline}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:500;background:var(--blue);border:2px solid var(--panel);box-shadow:0 0 0 2px var(--yellow);font-size:14px}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 20px 8vh;gap:26px}
.hero .logo{font-size:var(--logo-size,88px);max-width:100%}
.hero .sbox{max-width:584px}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{background:var(--chip);border:1px solid var(--chip);border-radius:4px;padding:0 16px;height:36px;color:var(--text);font-size:14px}
.btn:hover{border-color:var(--border);box-shadow:0 1px 1px rgba(0,0,0,.15)}
.offered{color:var(--muted);font-size:13px;text-align:center;line-height:1.8}
.offered b{font-weight:400;color:var(--link);cursor:default}
footer{background:var(--footer);color:var(--muted);font-size:14px;border-top:1px solid var(--border)}
footer .row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 24px}

/* ---------- results ---------- */
#results{flex:1}
.rhead{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:15;border-bottom:1px solid var(--border)}
.rtop{display:flex;align-items:center;gap:24px;padding:16px 20px 0 24px;flex-wrap:wrap}
.rtop .logo{font-size:30px}
.rtop .sbox{max-width:690px;flex:1;min-width:220px}
.rtop .avatar{margin-left:auto}
.tabs{display:flex;gap:6px;padding:8px 20px 0 24px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px 9px;color:var(--muted);font-size:14px;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.on{color:var(--blue);border-bottom-color:var(--blue)}
.rbody{display:flex;gap:56px;padding:6px 20px 60px 24px;align-items:flex-start;max-width:1180px}
.col{flex:1;min-width:0;max-width:652px}
.panelcol{width:380px;flex:none;margin-top:18px}
.stats{color:var(--muted);font-size:14px;margin:12px 0 4px}
.dym{font-size:16px;margin:0 0 18px}
.dym i{color:var(--red)} .dym a{color:var(--link);font-style:italic;font-weight:500;cursor:pointer}
.dym a:hover{text-decoration:underline}
.res{margin:0 0 28px}
.res .site{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.fav{width:26px;height:26px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:13px;flex:none;border:1px solid var(--border)}
.site .n{font-size:14px;line-height:1.3;color:var(--text)}
.site .u{font-size:12px;color:var(--url);line-height:1.3;opacity:.85}
.res h3{margin:4px 0 3px;font-weight:400;font-size:20px;line-height:1.3}
.res h3 button{background:none;border:0;padding:0;text-align:left;color:var(--link);font-size:inherit}
.res h3 button:hover{text-decoration:underline}
.res p{margin:0;color:var(--muted);font-size:14px;line-height:1.58}
.res p b{color:var(--text);font-weight:500}
.full{margin-top:10px;padding:12px 14px;border-left:3px solid var(--blue);background:var(--hover);border-radius:0 8px 8px 0;color:var(--text);line-height:1.6;font-size:14.5px;animation:open .2s ease-out}
@keyframes open{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.ad{margin:0 0 26px}
.ad .tag{font-weight:700;font-size:13px;color:var(--text)}
.paa{border:1px solid var(--border);border-radius:8px;margin:0 0 28px}
.paa h4{margin:0;padding:14px 16px 6px;font-weight:500;font-size:18px}
.paa details{border-top:1px solid var(--border);padding:0 16px}
.paa details:first-of-type{border-top:0}
.paa summary{list-style:none;cursor:pointer;padding:13px 0;display:flex;justify-content:space-between;gap:12px;font-size:15px}
.paa summary::-webkit-details-marker{display:none}
.paa summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:5px 4px 0 0;flex:none;transition:transform .15s}
.paa details[open] summary::after{transform:rotate(-135deg);margin-top:9px}
.paa .ans{padding:0 0 16px;color:var(--muted);line-height:1.6;font-size:14px}
.kp{border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--panel)}
.kp .banner{height:92px;background:linear-gradient(90deg,var(--blue) 0 25%,var(--red) 25% 50%,var(--yellow) 50% 75%,var(--green) 75%)}
.kp .in{padding:0 18px 18px;margin-top:-34px}
.kp .big{width:68px;height:68px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font:500 32px var(--logo);color:var(--blue);border:4px solid var(--panel);box-shadow:0 0 0 1px var(--border)}
.kp h2{margin:10px 0 0;font-size:26px;font-weight:400;line-height:1.2}
.kp .sub{color:var(--muted);margin:2px 0 12px}
.kp .desc{line-height:1.6;margin:0 0 14px}
.kp dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;line-height:1.5}
.kp dt{font-weight:500}.kp dd{margin:0;color:var(--text)}
.kp .actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.pill{border:1px solid var(--border);background:var(--panel);border-radius:18px;height:34px;padding:0 14px;color:var(--link)}
.pill:hover{background:var(--hover)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-top:18px}
.tile{border-radius:12px;overflow:hidden;border:1px solid var(--border);background:var(--panel)}
.tile .img{aspect-ratio:4/3;display:grid;place-items:center;font-size:44px}
.tile .cap{padding:8px 10px 10px;font-size:13px;line-height:1.4}
.tile .cap small{display:block;color:var(--muted);font-size:12px}
.place{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--border)}
.place .pin{width:40px;height:40px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:20px;flex:none}
.place b{font-weight:500;font-size:16px;color:var(--link)}
.place .st{color:#e37400;letter-spacing:1px;font-size:13px}
.place p{margin:2px 0 0;color:var(--muted);line-height:1.5}
.news{padding:16px 0;border-bottom:1px solid var(--border)}
.news .src{font-size:12px;color:var(--muted);margin-bottom:4px}
.news b{font-size:18px;font-weight:500;line-height:1.35;display:block}
.news p{margin:4px 0 0;color:var(--muted);line-height:1.5}

.tile.ph{padding:0;text-align:left;cursor:zoom-in;color:var(--text)}
.tile.ph img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:55;display:grid;place-items:center;padding:20px;animation:fade .2s}
.lb figure{margin:0;max-width:min(920px,100%);text-align:center;color:#fff}
.lb img{max-width:100%;max-height:78vh;border-radius:8px}
.lb figcaption{margin-top:10px;font-size:15px}
/* ---------- photos ---------- */
.grid{display:block;column-width:190px;column-gap:14px}
.tile{break-inside:avoid;margin-bottom:14px}
.tile.ph img{aspect-ratio:auto}
.kp .banner{height:112px;background:center 45%/cover;border-bottom:4px solid;border-image:linear-gradient(90deg,var(--blue) 25%,var(--red) 0 50%,var(--yellow) 0 75%,var(--green) 0) 1}
.kp .big{overflow:hidden;padding:0}.kp .big img{width:100%;height:100%;object-fit:cover}
.lb{gap:8px;grid-template-columns:auto minmax(0,1fr) auto}
.lb figcaption small{display:block;opacity:.7;font-size:13px;margin-top:3px}
.lbn{background:rgba(255,255,255,.14);border:0;color:#fff;width:42px;height:42px;border-radius:50%;font-size:26px;line-height:1}
.lbn:hover{background:rgba(255,255,255,.28)}
.cardph{display:block;width:150px;margin:-8px auto 14px;border-radius:6px;border:6px solid #fff;border-bottom-width:22px;box-shadow:0 4px 14px rgba(0,0,0,.25);transform:rotate(-3deg)}
@media (max-width:560px){.lbn{width:34px;height:34px}}
/* ---------- lucky card ---------- */
.overlay{position:fixed;inset:0;background:rgba(32,33,36,.62);z-index:50;display:grid;place-items:center;padding:20px;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card{background:var(--panel);color:var(--text);border-radius:20px;max-width:440px;width:100%;padding:34px 28px 26px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.35);max-height:90vh;overflow:auto}
.card .cake{font-size:64px;line-height:1;cursor:pointer;background:none;border:0;display:inline-block;transition:transform .15s}
.card .cake:active{transform:scale(.9) rotate(-6deg)}
.card h2{margin:12px 0 4px;font:500 30px/1.15 var(--logo);letter-spacing:-.02em}
.card h2 span:nth-child(4n+1){color:var(--blue)}
.card .msg{line-height:1.7;font-size:16px;margin:12px 0 4px;white-space:pre-line}
.card .sig{color:var(--muted);margin:14px 0 20px}
.card .hint{color:var(--muted);font-size:12px;margin-top:10px}
.solid{background:var(--blue);color:#fff;border:0;border-radius:20px;height:40px;padding:0 22px;font-weight:500}
.solid:hover{filter:brightness(1.08)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60;width:100%;height:100%}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#323232;color:#fff;padding:12px 18px;border-radius:8px;z-index:70;font-size:14px;animation:fade .2s;max-width:90vw}

/* ---------- edit panel (only with #edit) ---------- */
#edit{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:12px;width:260px;font-size:13px}
#edit label{display:block;margin:8px 0 3px;color:var(--muted)}
#edit input,#edit textarea{width:100%;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:6px;padding:7px 8px;font:14px var(--sans)}
#edit b{font-weight:500}

@media (max-width:900px){
  .rbody{flex-direction:column;gap:8px}
  .panelcol{width:100%;order:-1;margin-top:12px}
  .col{max-width:none;width:100%}
}
@media (max-width:560px){
  .topbar{padding:10px 14px}
  .rtop{gap:12px;padding:12px 14px 0}
  .rtop .sbox{order:3;flex-basis:100%}
  .tabs{padding-left:10px}
  .rbody{padding-left:16px;padding-right:16px}
  footer .row{padding:12px 16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>

function toast(t) {
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = t; el.setAttribute("role", "status");
  document.body.appendChild(el); setTimeout(() => el.remove(), 2600);
}

function renderLogos() {

  $("#logoHome").innerHTML = letters; $("#logoRes").innerHTML = letters;
  const len = Math.max(S.name.length, 3);
  const size = Math.max(44, Math.min(92, 520 / len * 1.5));
  document.documentElement.style.setProperty("--logo-size", `min(${size}px, ${Math.floor(92 / len * 1.35)}vw)`);
  const init = esc(S.name.trim().charAt(0).toUpperCase() || "A");
  $("#avHome").textContent = init; $("#avRes").textContent = init;
}

function makeSearchBox(root, id) {
  root.innerHTML = `
    <div class="sbar" role="search">${ICON.search}
      <input id="${id}" type="text" autocomplete="off" spellcheck="false" aria-label="Search" aria-autocomplete="list">
      <button class="mic" type="button" aria-label="Search by voice">${ICON.mic}</button>
    </div>
    <ul class="sug hidden" role="listbox"></ul>`;
  const input = $("input", root), list = $(".sug", root);
  let sel = -1;
  const items = () => [...list.children];
  const open = () => {
    list.innerHTML = SUGGESTIONS.map(s => `<li role="option">${ICON.search.replace('width="20" height="20"', 'width="18" height="18"')}<span>${esc(plain(s))}</span></li>`).join("");
    list.classList.remove("hidden"); root.classList.add("open"); sel = -1;
  };
  const close = () => { list.classList.add("hidden"); root.classList.remove("open"); };
  input.addEventListener("focus", () => { userTouched = true; open(); });
  input.addEventListener("input", () => { userTouched = true; if (list.classList.contains("hidden")) open(); });
  input.addEventListener("keydown", e => {
    const li = items();
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      if (list.classList.contains("hidden")) open();
      const n = li.length; sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + n + 1) % (n + 1);
      if (sel === n) sel = -1;
      li.forEach((x, i) => x.classList.toggle("sel", i === sel));
      if (sel >= 0) input.value = li[sel].textContent;
    } else if (e.key === "Enter") { e.preventDefault(); close(); doSearch(input.value); input.blur(); }
    else if (e.key === "Escape") close();
  });
  list.addEventListener("mousedown", e => {
    const li = e.target.closest("li"); if (!li) return;
    e.preventDefault(); close(); doSearch(li.textContent);
  });
  $(".mic", root).addEventListener("click", () => { input.focus(); userTouched = false; toast("Listening... say \"happy birthday\""); typeInto(input, "happy birthday " + S.name); });
  document.addEventListener("click", e => { if (!root.contains(e.target)) close(); });
  return { input, close };
}

let userTouched = false, typing = false;
function typeInto(input, text) {
  if (typing) return;
  typing = true; input.value = "";
  let i = 0;
  const tick = () => {
    if (userTouched && i > 0 && input.value !== text.slice(0, i)) { typing = false; return; }
    if (i <= text.length) { input.value = text.slice(0, i++); setTimeout(tick, 70 + Math.random() * 50); }
    else typing = false;
  };
  tick();
}

const cv = $("#confetti"), cx = cv.getContext("2d");
let parts = [], raf = 0;
function burst() {
  if (reduce) return;
  cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio;
  cv.classList.remove("hidden");
  const cols = ["#4285f4", "#ea4335", "#fbbc05", "#34a853"], W = cv.width, H = cv.height, d = devicePixelRatio;
  for (let i = 0; i < 140; i++) parts.push({
    x: W / 2 + (Math.random() - .5) * W * .3, y: H * .55,
    vx: (Math.random() - .5) * 18 * d, vy: (-Math.random() * 18 - 6) * d,
    s: (Math.random() * 7 + 5) * d, r: Math.random() * 6, vr: (Math.random() - .5) * .4,
    c: cols[i % 4], life: 0
  });
  if (!raf) loop();
}
function loop() {
  cx.clearRect(0, 0, cv.width, cv.height);
  const g = .5 * devicePixelRatio;
  parts = parts.filter(p => p.y < cv.height + 30 && p.life < 220);
  parts.forEach(p => {
    p.vy += g; p.x += p.vx; p.y += p.vy; p.vx *= .99; p.r += p.vr; p.life++;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c;
    cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); cx.restore();
  });
  if (parts.length) raf = requestAnimationFrame(loop);
  else { raf = 0; cv.classList.add("hidden"); }
}
